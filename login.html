<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard", sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f6f7;
}

.login-box{
    width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:800;
    color:#00dc64;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    height:50px;
    padding:0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#00dc64;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#00dc64;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.login-btn:hover{
    opacity:.9;
}

.sub-menu{
    margin-top:20px;
    text-align:center;
}

.sub-menu a{
    text-decoration:none;
    color:#666;
    font-size:14px;
    margin:0 10px;
}

.sub-menu a:hover{
    color:#00dc64;
}

</style>
</head>
<body>

<div class="login-box">

<div class="logo">
WEBTOON
</div>

<form onsubmit="login(event)">

<div class="input-group">
<input
id="id"
type="text"
placeholder="아이디 입력"
required
value="admin">
</div>

<div class="input-group">
<input
id="pw"
type="password"
placeholder="비밀번호 입력"
required
value="1234">
</div>

<button type="submit" class="login-btn">
로그인
</button>

</form>

<div class="sub-menu">
<a href="signup.html">회원가입</a>
<a href="#">아이디 찾기</a>
<a href="#">비밀번호 찾기</a>
</div>

</div>

<script>
function login(event){

    event.preventDefault();

    const id = document.getElementById("id").value;
    const pw = document.getElementById("pw").value;

    if(id === "admin" && pw === "1234"){

        localStorage.setItem("isLogin","true");
        localStorage.setItem("userId",id);

        location.href = "monday.html";
    }
    else{
        alert("아이디 또는 비밀번호가 틀렸습니다.");
    }
}
</script>

</body>
</html>
