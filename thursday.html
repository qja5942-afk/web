<script>

}

];

webtoons.sort((a,b)=>
new Date(b.date) - new Date(a.date)
);

const grid = document.getElementById("webtoonGrid");

webtoons.forEach((toon,index)=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
${index < 3 ? '<div class="new-badge">NEW</div>' : ''}

<img src="${toon.img}" class="thumbnail">

<div class="card-body">
<div class="title">${toon.title}</div>
<div class="author">${toon.author}</div>
<div class="rating">★ ${toon.rating}</div>
<div class="upload-date">업데이트 : ${toon.date}</div>
</div>
`;

grid.appendChild(card);

const loginBtn = document.getElementById("loginBtn");

if(localStorage.getItem("isLogin") === "true"){

    loginBtn.innerText = "로그아웃";

    loginBtn.onclick = function(e){

        e.preventDefault();

        localStorage.removeItem("isLogin");
        localStorage.removeItem("userId");

        alert("로그아웃 되었습니다.");

        location.reload();
    };
}

});

</script>
